let score=0,level=0,lives=3,running=false,word=null,last=0,raf=0,timer=null,serial=0;
let audio=null,soundOn=true,flyX=-170,flyDir=1,flyClock=0,shots=[],particles=[];
function audioReady(){try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==='suspended')audio.resume()}catch(e){}}
function tone(f,d,type='sine',v=.05,delay=0,end=null){if(!soundOn)return;audioReady();if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.12,v=.025){if(!soundOn)return;audioReady();if(!audio)return;try{const n=Math.max(1,Math.floor(audio.sampleRate*d)),buf=audio.createBuffer(1,n,audio.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=audio.createBufferSource(),g=audio.createGain();s.buffer=buf;g.gain.value=v;s.connect(g);g.connect(audio.destination);s.start()}catch(e){}}
function sfx(k){if(k==='type')tone(650+Math.random()*150,.035,'square',.018);if(k==='laser'){tone(850,.22,'sawtooth',.065,0,110);tone(160,.25,'triangle',.05,.04,70);noise(.13,.03)}if(k==='boom'){noise(.28,.07);tone(120,.28,'sine',.07,0,45)}if(k==='miss'){tone(390,.18,'sine',.05,0,210);tone(180,.25,'triangle',.04,.12,95)}if(k==='level')[523,659,784,988,1175].forEach((f,i)=>tone(f,.23,'triangle',.06,i*.1));if(k==='click')tone(720,.06,'sine',.03)}
function say(t){$('message').textContent=t}function hud(){$('score').textContent=score;$('level').textContent=level+1;$('lives').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives)}
function stopTimer(){if(timer!==null){clearTimeout(timer);timer=null}}
function newWord(){const pool=words[level];word={text:pool[Math.floor(Math.random()*pool.length)],y:92,done:false,speed:[.018,.022,.026][level]+Math.random()*.004,id:++serial};draw()}
function burst(x,y){for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color:['#fff36a','#ff9d35','#7df7ff','#fff'][i%4]})}}
function draw(){ctx.clearRect(0,0,900,506);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,900,506);else{ctx.fillStyle='#75bce5';ctx.fillRect(0,0,900,506)}
// 익룡 좌우 순찰: 스프라이트시트 2x2 프레임을 순서대로 재생
if(ptero.complete&&ptero.naturalWidth){const cell=ptero.naturalWidth/2,frame=Math.floor(flyClock/180)%4, sx=(frame%2)*cell,sy=Math.floor(frame/2)*cell,pw=185,ph=145,py=64+Math.sin(flyClock/450)*18;ctx.save();if(flyDir<0){ctx.translate(flyX+pw,0);ctx.scale(-1,1);ctx.drawImage(ptero,sx,sy,cell,cell,0,py,pw,ph)}else ctx.drawImage(ptero,sx,sy,cell,cell,flyX,py,pw,ph);ctx.restore()}
const shade=ctx.createLinearGradient(0,40,0,230);shade.addColorStop(0,'#082d3b70');shade.addColorStop(1,'#082d3b00');ctx.fillStyle=shade;ctx.fillRect(0,40,900,190);
if(word&&!word.done){ctx.save();ctx.font='bold 38px Arial,sans-serif';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#123b4c';ctx.strokeText(word.text,450,word.y);ctx.fillStyle='#fff27a';ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillText(word.text,450,word.y);ctx.restore()}
for(const s of shots){ctx.save();ctx.globalAlpha=Math.max(0,s.life);ctx.strokeStyle='#7bfffa';ctx.lineWidth=7;ctx.shadowColor='#7bfffa';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(450,430);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
}
function schedule(ms){stopTimer();const id=serial;timer=setTimeout(()=>{timer=null;if(running&&id===serial&&word&&word.done)newWord()},ms)}
function start(){cancelAnimationFrame(raf);stopTimer();audioReady();sfx('click');score=0;level=0;lives=3;running=true;last=0;word=null;serial++;flyX=-170;flyDir=1;flyClock=0;shots=[];particles=[];input.value='';$('welcome').classList.add('hidden');hud();say('마을 수호 작전 시작! 단어를 입력해 레이저를 발사하세요.');newWord();input.focus();raf=requestAnimationFrame(loop)}
function loop(t){if(!running)return;const dt=last?Math.min(t-last,50):0;last=t;flyClock+=dt;flyX+=flyDir*dt*.11;if(flyX>910){flyX=910;flyDir=-1}if(flyX<-190){flyX=-190;flyDir=1}if(word&&!word.done){word.y+=word.speed*dt;if(word.y>=420){word.done=true;lives--;sfx('miss');hud();if(lives<=0){running=false;say('마을 에너지가 모두 소진됐어요. 다시 시작해 주세요!');draw();return}say('공룡이 마을 가까이 왔어요! 다음 단어를 막아주세요.');schedule(1000)}}shots=shots.filter(s=>(s.life-=dt/450)>0);particles=particles.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.05,(p.life-=dt/650)>0));draw();raf=requestAnimationFrame(loop)}
function submit(){if(!running||!word||word.done)return;if(input.value.trim()===word.text){word.done=true;score++;sfx('laser');sfx('boom');shots.push({x:450,y:word.y,life:1});burst(450,word.y);input.value='';hud();say('⚡ 명중! 공룡마을을 지켰어요! +1점');if(score%20===0&&level<2){level++;hud();sfx('level');say('우와~~고수네.. 디지털배움터 화이팅~~!!');schedule(1800)}else schedule(700)}else{say('단어가 맞지 않아요. 글자를 다시 확인해 주세요!');tone(230,.13,'triangle',.025);input.select()}draw();input.focus()}
